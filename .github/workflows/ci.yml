name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Typecheck UI
        run: npm --workspace=@chessonglass/ui run typecheck
      - name: Build workspaces and UI
        run: npm run build
      - name: Brand and hygiene checks
        run: npm run check:brand
      - name: Unit and integration tests
        run: npm run test:unit
